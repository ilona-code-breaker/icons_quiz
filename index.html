        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            justify-content: center;
            align-items: center;
            padding: 20px;

                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;

            text-align: center;
            margin-bottom: 32px;

            font-size: 2.2rem;
            font-weight: 800;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .quiz-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .progress-container {
            margin-bottom: 28px;
        }

            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 8px;
            background: var(--card-border);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #f1f5f9;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .option-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            user-select: none;
        }

        .option-card:hover {
            background: var(--option-hover);
            border-color: #475569;
            transform: translateY(-1px);
        }

        .option-card.selected {
            background: var(--option-selected);
            border-color: var(--option-border-selected);
            box-shadow: 0 0 0 1px var(--option-border-selected);
        }

        .option-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: var(--transition);
        }

        .option-card.selected .option-indicator {
            border-color: var(--accent-primary);
            background: var(--accent-primary);
        }

        .option-indicator::after {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            opacity: 0;
            transition: var(--transition);
        }

        .option-card.selected .option-indicator::after {
            opacity: 1;
        }

        .option-text {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .quiz-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--card-border);
            color: var(--text-main);
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-view {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(236, 72, 153, 0.15);
            color: var(--accent-primary);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .result-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .result-show {
            font-size: 1.1rem;
            color: var(--accent-secondary);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .result-quote {
            font-style: italic;
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid var(--accent-primary);
            padding: 16px 20px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            text-align: left;
            margin-bottom: 28px;
            color: #cbd5e1;
            font-size: 1.05rem;

        .result-description {
            text-align: left;
            line-height: 1.7;
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 32px;
            background: rgba(15, 23, 42, 0.4);
            padding: 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
        }

        .traits-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;

        .trait-tag {
            background: var(--card-border);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }
            .quiz-title {
                font-size: 1.75rem;
            }
            .result-name {
                font-size: 2rem;
            }
        }
    </style>
</head>

                name: "Amy Santiago",
                show: "Brooklyn Nine-Nine",
                quote: "Life is unpredictable. Not everything can be linked to a color-coded tab.",
                desc: "Methodical, deeply ambitious, and proud of it, you thrive on order, structure, and continuous self-improvement. You prove that being a competitive nerd is a genuine superpower.",
                traits: ["Binder Enthusiast", "Fiercely Ambitious", "Competitive", "Type-A Perfectionist"]
            },
            jess: {
                name: "Jessica Day",
                show: "New Girl",
                quote: "I hope you like feminist rants, because that's kind of my thing.",
                desc: "Quirky, deeply emotional, and unapologetically eccentric, you lead with your massive heart. You bring creative energy and joyful optimism to every messy situation.",
                traits: ["Quirky & Creative", "Pure Heart", "Emotional", "Joyfully Eccentric"]
            }
        };

        let currentQuestion = 0;
        let selectedAnswers = Array(quizData.length).fill(null);

        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCount = document.getElementById('question-count');
        const progressPercent = document.getElementById('progress-percent');
        const progressFill = document.getElementById('progress-fill');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRestart = document.getElementById('btn-restart');

        function loadQuestion(index) {
            const data = quizData[index];
            questionText.textContent = data.question;
            
            const progress = ((index + 1) / quizData.length) * 100;
            questionCount.textContent = `Question ${index + 1} of ${quizData.length}`;
            progressPercent.textContent = `${Math.round(progress)}%`;
            progressFill.style.width = `${progress}%`;

            optionsContainer.innerHTML = '';
            data.options.forEach((opt) => {
                const isSelected = selectedAnswers[index] === opt.key;
                const card = document.createElement('div');
                card.className = `option-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="option-indicator"></div>
                    <div class="option-text">${opt.text}</div>
                `;
                card.addEventListener('click', () => selectOption(opt.key));
                optionsContainer.appendChild(card);
            });

            btnPrev.disabled = index === 0;
            btnNext.disabled = selectedAnswers[index] === null;
            btnNext.textContent = index === quizData.length - 1 ? 'See Results ★' : 'Next Question →';
        }

        function selectOption(key) {
            selectedAnswers[currentQuestion] = key;
            loadQuestion(currentQuestion);
        }

        btnPrev.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                showResults();
            }
        });

        function showResults() {
            const counts = {};
            selectedAnswers.forEach(key => {
                if (key) counts[key] = (counts[key] || 0) + 1;
            });

            let winnerKey = "leslie";
            let maxCount = 0;
            for (const [key, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    winnerKey = key;
                }
            }

            const profile = characterProfiles[winnerKey];

            document.getElementById('char-name').textContent = profile.name;
            document.getElementById('char-show').textContent = profile.show;
            document.getElementById('char-quote').textContent = `"${profile.quote}"`;
            document.getElementById('char-desc').textContent = profile.desc;

            const traitsContainer = document.getElementById('char-traits');
            traitsContainer.innerHTML = '';
            profile.traits.forEach(trait => {
                const tag = document.createElement('span');
                tag.className = 'trait-tag';
                tag.textContent = trait;
                traitsContainer.appendChild(tag);
            });

            quizView.style.display = 'none';
            resultView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        btnRestart.addEventListener('click', () => {
            currentQuestion = 0;
            selectedAnswers = Array(quizData.length).fill(null);
            resultView.style.display = 'none';
            quizView.style.display = 'block';
            loadQuestion(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        loadQuestion(0);
    </script>
</body>
</html>
